[project]
name = "pitraincontroller"
version = "0.1.0"
description = "Modern Raspberry Pi host software for the PiTrainController HAT (Marklin CAN + S88 bridge)"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.3",
    "lgpio>=0.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitraincontroller*"]
